<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {% endif %}Tart Cherry</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        cherry: { 50:'#fff1f2', 100:'#ffe4e6', 500:'#f43f5e', 600:'#e11d48', 800:'#9f1239', 900:'#881337' }
                    }
                }
            }
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
    MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
      svg: { fontCache: 'global' }
    };
    </script>
    <script type="text/javascript" id="MathJax-script" async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js">
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Custom styling for Markdown content (Typography) */
        .prose h1 { @apply text-3xl font-bold text-gray-900 mt-8 mb-4; }
        .prose h2 { @apply text-2xl font-bold text-gray-800 mt-8 mb-4 pb-2 border-b; }
        .prose h3 { @apply text-xl font-bold text-gray-800 mt-6 mb-3; }
        .prose p { @apply text-gray-600 leading-relaxed mb-4 text-lg; }
        .prose ul { @apply list-disc list-outside ml-6 mb-4 text-gray-600; }
        .prose ol { @apply list-decimal list-outside ml-6 mb-4 text-gray-600; }
        .prose a { @apply text-cherry-600 hover:text-cherry-800 underline decoration-cherry-200 underline-offset-2 transition; }
        .prose code { @apply bg-gray-100 text-cherry-600 px-1 py-0.5 rounded text-sm font-mono; }
        .prose pre { @apply bg-gray-900 text-gray-100 p-4 rounded-lg overflow-x-auto mb-6; }
        .prose table { @apply min-w-full divide-y divide-gray-200 mb-6 border; }
        .prose th { @apply bg-gray-50 px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider; }
        .prose td { @apply px-4 py-3 whitespace-nowrap text-sm text-gray-600 border-t border-gray-100; }
        .prose blockquote { @apply border-l-4 border-cherry-200 pl-4 italic text-gray-500 my-6; }
        .prose img { @apply rounded-xl shadow-md my-6 max-w-full h-auto; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased flex flex-col min-h-screen">

    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50 bg-opacity-95 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="{{ site.baseurl }}/" class="flex items-center gap-2 group">
                        <i class="fa-solid fa-chart-line text-cherry-600 text-2xl group-hover:scale-110 transition"></i>
                        <span class="font-bold text-xl tracking-tight text-gray-900">Tart Cherry</span>
                    </a>
                </div>
                <div class="hidden md:flex items-center space-x-8">
                    <a href="{{ site.baseurl }}/#modules" class="text-gray-600 hover:text-cherry-600 font-medium transition">Modules</a>
                    <a href="{{ site.baseurl }}/#advanced" class="text-gray-600 hover:text-cherry-600 font-medium transition">Advanced Cases</a>
                    <a href="{{ site.baseurl }}/about.markdown" class="text-gray-600 hover:text-cherry-600 font-medium transition">About</a>
                </div>
                <div class="flex items-center md:hidden">
                    <button type="button" class="text-gray-500 hover:text-gray-900" onclick="document.getElementById('mobile-menu').classList.toggle('hidden')">
                        <i class="fa-solid fa-bars text-xl"></i>
                    </button>
                </div>
            </div>
        </div>
        <div class="hidden md:hidden bg-white border-t" id="mobile-menu">
            <div class="px-2 pt-2 pb-3 space-y-1">
                <a href="{{ site.baseurl }}/#modules" class="block px-3 py-2 rounded-md font-medium text-gray-700 hover:bg-gray-50">Modules</a>
                <a href="{{ site.baseurl }}/#advanced" class="block px-3 py-2 rounded-md font-medium text-gray-700 hover:bg-gray-50">Advanced Cases</a>
                <a href="{{ site.baseurl }}/about.markdown" class="block px-3 py-2 rounded-md font-medium text-gray-700 hover:bg-gray-50">About</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow">
        {{ content }}
    </main>

    <footer class="bg-white border-t border-gray-200 pt-12 pb-8 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center">
            <div class="mb-4 md:mb-0">
                <span class="font-bold text-gray-900">Tart Cherry</span>
                <span class="text-gray-500 ml-2 text-sm">| Optimization Models for MSBA518</span>
            </div>
            <div class="flex space-x-6 text-gray-400">
                <a href="https://github.com/ytyimin" class="hover:text-cherry-600 transition"><i class="fa-brands fa-github text-xl"></i></a>
                <a href="mailto:ytyimin@gmail.com" class="hover:text-cherry-600 transition"><i class="fa-solid fa-envelope text-xl"></i></a>
            </div>
        </div>
        <div class="mt-8 text-center text-xs text-gray-400">
            &copy; {{ site.time | date: '%Y' }} Tart Cherry. Hosted on GitHub Pages.
        </div>
    </footer>

</body>
</html>
