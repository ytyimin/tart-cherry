<!DOCTYPE html>
<html lang="en" class="h-full antialiased selection:bg-rose-500 selection:text-white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} - {% endif %}Tart Cherry</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                    },
                    colors: {
                        dark: { 800: '#1e293b', 900: '#0f172a', 950: '#020617' },
                        rose: { 500: '#f43f5e', 600: '#e11d48' } // Tart Cherry
                    }
                }
            }
        }
    </script>

    <script>
    MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
      svg: { fontCache: 'global' }
    };
    </script>
    <script type="text/javascript" id="MathJax-script" async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js">
    </script>
</head>
<body class="bg-dark-950 text-slate-300 h-full flex overflow-hidden">

    <aside class="hidden md:flex w-64 flex-col border-r border-white/5 bg-dark-900/50 backdrop-blur-xl h-full">
        <div class="p-6">
            <a href="{{ site.baseurl }}/" class="flex items-center gap-3 group">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-rose-500 to-purple-600 flex items-center justify-center shadow-lg shadow-rose-500/20 group-hover:scale-110 transition">
                    <i class="fa-solid fa-cherry text-white text-sm"></i>
                </div>
                <span class="font-display font-bold text-xl text-white tracking-tight">Tart Cherry</span>
            </a>
        </div>

        <nav class="flex-1 px-4 space-y-1 overflow-y-auto custom-scrollbar">
            <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2 mt-4 px-2">Core Modules</div>
            
            <a href="{{ site.baseurl }}/introduction.markdown" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-white/5 hover:text-white transition {% if page.url contains 'introduction' %}bg-white/10 text-white{% endif %}">
                <i class="fa-solid fa-book-open w-5 text-center"></i> <span>Intro</span>
            </a>
            <a href="{{ site.baseurl }}/linear.markdown" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-white/5 hover:text-white transition {% if page.url contains 'linear' %}bg-white/10 text-white{% endif %}">
                <i class="fa-solid fa-arrow-trend-up w-5 text-center"></i> <span>Linear</span>
            </a>
            <a href="{{ site.baseurl }}/network.markdown" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-white/5 hover:text-white transition {% if page.url contains 'network' %}bg-white/10 text-white{% endif %}">
                <i class="fa-solid fa-diagram-project w-5 text-center"></i> <span>Network</span>
            </a>
            <a href="{{ site.baseurl }}/integer.markdown" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-white/5 hover:text-white transition {% if page.url contains 'integer' %}bg-white/10 text-white{% endif %}">
                <i class="fa-solid fa-calculator w-5 text-center"></i> <span>Integer</span>
            </a>
            <a href="{{ site.baseurl }}/nonlinear.markdown" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-white/5 hover:text-white transition {% if page.url contains 'nonlinear' %}bg-white/10 text-white{% endif %}">
                <i class="fa-solid fa-wave-square w-5 text-center"></i> <span>Nonlinear</span>
            </a>
            <a href="{{ site.baseurl }}/genetic.markdown" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-white/5 hover:text-white transition {% if page.url contains 'genetic' %}bg-white/10 text-white{% endif %}">
                <i class="fa-solid fa-dna w-5 text-center"></i> <span>Genetic</span>
            </a>
            
            <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2 mt-8 px-2">Resources</div>
            <a href="{{ site.baseurl }}/about.markdown" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-white/5 hover:text-white transition">
                <i class="fa-solid fa-circle-info w-5 text-center"></i> <span>About</span>
            </a>
            <a href="https://github.com/ytyimin/tart-cherry" target="_blank" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-white/5 hover:text-white transition">
                <i class="fa-brands fa-github w-5 text-center"></i> <span>Repository</span>
            </a>
        </nav>
    </aside>

    <main class="flex-1 overflow-y-auto relative scroll-smooth">
        <div class="absolute top-0 left-0 w-full h-96 bg-gradient-to-b from-rose-900/20 to-transparent pointer-events-none"></div>
        
        <div class="relative z-10 pb-24 md:pb-10">
            {{ content }}
        </div>
    </main>

    <nav class="md:hidden fixed bottom-0 w-full bg-dark-900/90 backdrop-blur-xl border-t border-white/10 pb-safe z-50">
        <div class="flex justify-around items-center h-16">
            <a href="{{ site.baseurl }}/" class="flex flex-col items-center gap-1 text-xs text-slate-400 hover:text-rose-500">
                <i class="fa-solid fa-house text-lg"></i>
                <span>Home</span>
            </a>
            <a href="{{ site.baseurl }}/linear.markdown" class="flex flex-col items-center gap-1 text-xs text-slate-400 hover:text-rose-500">
                <i class="fa-solid fa-arrow-trend-up text-lg"></i>
                <span>Linear</span>
            </a>
            <a href="{{ site.baseurl }}/network.markdown" class="flex flex-col items-center gap-1 text-xs text-slate-400 hover:text-rose-500">
                <i class="fa-solid fa-diagram-project text-lg"></i>
                <span>Network</span>
            </a>
            <button onclick="document.getElementById('mobile-menu-overlay').classList.remove('hidden')" class="flex flex-col items-center gap-1 text-xs text-slate-400 hover:text-white">
                <i class="fa-solid fa-bars text-lg"></i>
                <span>More</span>
            </button>
        </div>
    </nav>

    <div id="mobile-menu-overlay" class="fixed inset-0 bg-dark-950 z-[60] hidden flex flex-col p-6 animate-fade-in">
        <div class="flex justify-between items-center mb-8">
            <span class="font-display font-bold text-2xl text-white">Menu</span>
            <button onclick="document.getElementById('mobile-menu-overlay').classList.add('hidden')" class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center text-white">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <a href="{{ site.baseurl }}/integer.markdown" class="p-4 bg-white/5 rounded-xl border border-white/5 hover:border-rose-500/50 transition">
                <i class="fa-solid fa-calculator text-rose-500 text-xl mb-2"></i>
                <div class="font-bold text-white">Integer</div>
            </a>
            <a href="{{ site.baseurl }}/nonlinear.markdown" class="p-4 bg-white/5 rounded-xl border border-white/5 hover:border-rose-500/50 transition">
                <i class="fa-solid fa-wave-square text-rose-500 text-xl mb-2"></i>
                <div class="font-bold text-white">Nonlinear</div>
            </a>
            <a href="{{ site.baseurl }}/genetic.markdown" class="p-4 bg-white/5 rounded-xl border border-white/5 hover:border-rose-500/50 transition">
                <i class="fa-solid fa-dna text-rose-500 text-xl mb-2"></i>
                <div class="font-bold text-white">Genetic</div>
            </a>
            <a href="{{ site.baseurl }}/about.markdown" class="p-4 bg-white/5 rounded-xl border border-white/5 hover:border-rose-500/50 transition">
                <i class="fa-solid fa-info text-rose-500 text-xl mb-2"></i>
                <div class="font-bold text-white">About</div>
            </a>
        </div>
    </div>

    <style>
        /* Custom Scrollbar for sleekness */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</body>
</html>
